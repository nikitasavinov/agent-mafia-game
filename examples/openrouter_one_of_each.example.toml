[game]
seed = -1
discussion_rounds = 2
speech_word_limit = 100
default_base_url = "https://openrouter.ai/api/v1"
# Export OPENROUTER_API_KEY before playing.
default_api_key_env = "OPENROUTER_API_KEY"
max_concurrency = 3

[[players]]
name = "Ivy Stone"
provider = "openai_compatible"
model = "ibm-granite/granite-4.1-8b"
communication_style = "angry, annoyed and passive-aggressive communication only"

