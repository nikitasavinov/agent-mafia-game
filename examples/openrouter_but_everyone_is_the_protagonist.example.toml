[game]
seed = -1
discussion_rounds = 2
speech_word_limit = 100
default_base_url = "https://openrouter.ai/api/v1"
# Export OPENROUTER_API_KEY before playing.
default_api_key_env = "OPENROUTER_API_KEY"
default_communication_style = "Treat the game as your personal story. Interpret every death as character development and every disagreement as another player's betrayal arc."
max_concurrency = 3

